# Owner: BE3
Run:
  type: object
  required: [date, vehicleId, trips]
  properties:
    date: { $ref: "./common.yaml#/DateOnly" }
    vehicleId: { type: string, examples: ["VEH043"] }
    trips:
      type: array
      items:
        type: object
        required: [tripId, tripNo, wave, stops]
        properties:
          tripId: { type: string, examples: ["clx0trp1a2b3c4d5e6f7g8h"] }
          tripNo: { type: integer, examples: [1] }
          wave: { $ref: "./common.yaml#/Wave" }
          stops: { type: array, items: { $ref: "./stops.yaml#/Stop" } }

Stop:
  type: object
  required: [id, seq, outletId, status]
  properties:
    id: { type: string, examples: ["clx0stp1a2b3c4d5e6f7g8h"] }
    seq: { type: integer, examples: [1] }
    outletId: { type: string, examples: ["OUT074"] }
    outletName: { type: string, examples: ["Fresh Nugegoda"] }
    status: { $ref: "./common.yaml#/StopStatus" }
    plannedArrivalAt: { $ref: "./common.yaml#/ClockTime" }
    windowOpen: { $ref: "./common.yaml#/ClockTime" }
    windowClose: { $ref: "./common.yaml#/ClockTime" }
    accessNote: { type: [string, "null"], examples: ["Rear dock. Van only."] }
    orders:
      type: array
      items:
        type: object
        required: [orderId, orderRef, expectedUnits]
        properties:
          orderId: { type: string, examples: ["clx0ord1a2b3c4d5e6f7g8h9"] }
          orderRef: { type: string, examples: ["ORD-004312"] }
          expectedUnits: { type: integer, examples: [120] }

StopEvent:
  type: object
  description: >
    One recorded fact about a stop. The client mints the ULID id, so replaying
    an event — online or from the offline outbox — is idempotent by
    construction. `occurredAt` is the DEVICE clock and must be presented as
    "recorded on device"; the server records its own receipt time separately.

    The `id` is the row's primary key. An id the server already holds is a
    `duplicate`: nothing is applied a second time (no order or stop status
    change, no notification, no decision-log entry). An id that is valid for
    one stop is `rejected` (`ID_REUSED`) when sent for another.

    Proof of delivery travels on a `POD_CAPTURED` event. Send `pages`; the
    legacy `signatureData` / `photoData` fields remain accepted for clients that
    predate pages. If both are sent, `pages` win and the legacy fields on that
    event are ignored (not stored), so a picture is never held twice.
  required: [id, type, occurredAt]
  properties:
    id: { $ref: "./common.yaml#/Ulid" }
    type:
      type: string
      enum: [ARRIVED, UNLOAD_START, DELIVERED, PART_DELIVERED, FAILED, SKIPPED, POD_CAPTURED]
      examples: ["ARRIVED"]
    occurredAt: { type: string, format: date-time, examples: ["2026-09-30T04:12:00Z"] }
    orderId: { type: [string, "null"], examples: [null] }
    deliveredUnits: { type: [integer, "null"], examples: [null] }
    recipientName: { type: [string, "null"], examples: [null] }
    signatureData:
      type: [string, "null"]
      description: Base64 data URL. Legacy single-image field; ignored when `pages` is non-empty.
      examples: [null]
    photoData:
      type: [string, "null"]
      description: Base64 data URL. Legacy single-image field; ignored when `pages` is non-empty.
      examples: [null]
    reasonCode: { type: [string, "null"], examples: [null] }
    pages:
      type: array
      maxItems: 8
      description: >
        Multi-page proof of delivery (a receipt with several sheets, a signature,
        a photo of the goods). Only on `POD_CAPTURED`; any other type is rejected
        (`PAGES_ON_NON_POD`). At most 8. Stored in array order (`seq`), in the
        same transaction as the event, so the pages exist if and only if the
        event does. Each page id is a client ULID and idempotent like the event.
      items: { $ref: "./stops.yaml#/PodPage" }
    tripStopId:
      type: [string, "null"]
      description: >
        Required on the batched POST /sync/stop-events path (a batch spans
        several stops and the server needs to route each event to the right
        one). Ignored and may be null on POST /stops/{stopId}/events, where
        the URL already carries the stop. Additive field; existing clients
        that omit it keep working on the per-stop path. On the sync path an
        event without it is `rejected` (`MISSING_TRIP_STOP_ID`) on its own;
        it does not fail the batch.
      examples: ["clx0stp1a2b3c4d5e6f7g8h"]

PodPage:
  type: object
  description: >
    One page of proof of delivery as the driver's phone captured it. The id is
    client-minted, so replaying a page cannot store it twice.
  required: [id, kind, data, capturedAt]
  additionalProperties: false
  properties:
    id: { $ref: "./common.yaml#/Ulid" }
    kind:
      type: string
      enum: [RECEIPT, SIGNATURE, PHOTO]
      examples: ["RECEIPT"]
    data:
      type: string
      maxLength: 1048576
      pattern: '^data:image/(png|jpeg|webp|svg\+xml);base64,'
      description: >
        A base64 image data URL (png, jpeg, webp or svg), at most 1,048,576
        characters (about 768 KiB of image). Anything else is rejected; the
        request-level limit is 12 MiB.
      examples: ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBD"]
    qualityFlags:
      type: [array, "null"]
      maxItems: 8
      description: >
        What the capture screen flagged at the time (blurry, cropped, dark), as
        short upper-case codes, kept so a disputed receipt can be examined with
        what the driver was told. Empty or omitted when nothing was flagged.
      items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$', examples: ["BLURRY"] }
    capturedAt:
      type: string
      format: date-time
      description: Device clock when the page was captured.
      examples: ["2026-09-30T04:55:30Z"]

PodPageSummary:
  type: object
  description: >
    A stored page without its image. Lists carry this; the image is not in a
    list of up to 500 events.
  required: [id, seq, kind, qualityFlags, capturedAt]
  properties:
    id: { $ref: "./common.yaml#/Ulid" }
    seq: { type: integer, description: "Position in capture order, starting at 0.", examples: [0] }
    kind: { type: string, enum: [RECEIPT, SIGNATURE, PHOTO], examples: ["RECEIPT"] }
    qualityFlags: { type: array, items: { type: string }, examples: [["BLURRY"]] }
    capturedAt: { type: string, format: date-time, examples: ["2026-09-30T04:55:30Z"] }

PulledStopEvent:
  type: object
  description: >
    A stored StopEvent as GET /sync/stop-events returns it. Same fields as
    StopEvent, plus the stop it belongs to, but `pages` carry metadata only.
  required: [id, type, occurredAt]
  properties:
    id: { $ref: "./common.yaml#/Ulid" }
    tripStopId: { type: string, examples: ["clx0stp1a2b3c4d5e6f7g8h"] }
    type:
      type: string
      enum: [ARRIVED, UNLOAD_START, DELIVERED, PART_DELIVERED, FAILED, SKIPPED, POD_CAPTURED]
      examples: ["POD_CAPTURED"]
    occurredAt: { type: string, format: date-time, examples: ["2026-09-30T04:56:00Z"] }
    orderId: { type: [string, "null"], examples: [null] }
    deliveredUnits: { type: [integer, "null"], examples: [null] }
    recipientName: { type: [string, "null"], examples: ["K. Jayasuriya"] }
    signatureData:
      type: [string, "null"]
      description: Legacy single image, present only on events recorded without pages.
      examples: [null]
    photoData:
      type: [string, "null"]
      description: Legacy single image, present only on events recorded without pages.
      examples: [null]
    reasonCode: { type: [string, "null"], examples: [null] }
    pages: { type: array, items: { $ref: "./stops.yaml#/PodPageSummary" } }

SubmitEventsRequest:
  type: object
  required: [deviceId, events]
  additionalProperties: false
  properties:
    deviceId: { type: string, examples: ["device-7f3a91"] }
    events:
      type: array
      minItems: 1
      items: { $ref: "./stops.yaml#/StopEvent" }

EventResult:
  type: object
  required: [id, status]
  properties:
    id: { $ref: "./common.yaml#/Ulid" }
    status:
      type: string
      description: >
        `duplicate` is a success, not an error — it is what a correct outbox
        replay looks like.
      enum: [accepted, duplicate, conflict]
      examples: ["accepted"]
    conflictState:
      type: [string, "null"]
      enum: [NONE, STALE_ASSIGNMENT, SUPERSEDED, null]

EventRejection:
  type: object
  description: >
    An event the server refused for a reason retrying cannot change, so the
    device should stop sending it and show the reason.
  required: [id, code, message]
  properties:
    id: { $ref: "./common.yaml#/Ulid" }
    code:
      type: string
      description: >
        One of STOP_NOT_ON_RUN (a stop the caller cannot see; same answer whether
        or not it exists), MISSING_TRIP_STOP_ID, ID_REUSED, ID_COLLISION,
        DELIVERED_INCOMPLETE, ORDER_NOT_ON_STOP, RECIPIENT_REQUIRED,
        POD_WITHOUT_DELIVERY, POD_REJECTED, POD_ALREADY_IN_REQUEST,
        STOP_ALREADY_CLOSED, STATE_MISMATCH, PAGES_ON_NON_POD, TOO_MANY_PAGES,
        DUPLICATE_PAGE_ID, PAGE_DATA_INVALID, PAGE_TOO_LARGE,
        INVALID_OCCURRED_AT. Clients should treat unknown codes as terminal.
      examples: ["STOP_NOT_ON_RUN"]
    message: { type: string, examples: ["Stop clx0stp9z8y7x6w5v4u3t2s is not on this driver's run."] }

SubmitEventsResult:
  type: object
  description: >
    Per-event outcomes. Every event sent is in exactly one of `results`
    (accepted, duplicate or conflict) or `rejected`. An event in neither failed
    for an unexpected reason (the database, say): it was NOT applied and is safe
    to send again.
  required: [accepted, duplicates, conflicts, results, rejected]
  properties:
    accepted: { type: integer, examples: [3] }
    duplicates: { type: integer, examples: [0] }
    conflicts: { type: integer, examples: [0] }
    results: { type: array, items: { $ref: "./stops.yaml#/EventResult" } }
    rejected: { type: array, items: { $ref: "./stops.yaml#/EventRejection" } }

SyncBatchRequest:
  type: object
  description: >
    The offline outbox drain. Events may span several stops, and each must carry
    `tripStopId`. This is the same applier as POST /stops/{stopId}/events,
    batched, so the online and offline paths can never diverge.

    Events are applied per stop in `occurredAt` order (ties keep their position
    in the batch). Each is judged on its own: a stop the caller cannot see, an
    invalid payload or a transition the stop refuses puts that event in
    `rejected` and the rest of the batch still applies. A conflict
    (STALE_ASSIGNMENT, SUPERSEDED) is recorded but not applied. A replayed batch
    reports every event as a duplicate and changes nothing.

    A delivery is one act: its DELIVERED/PART_DELIVERED lines and POD_CAPTURED
    event must travel in the same batch, and succeed or fail together.
  required: [deviceId, clientClockAt, events]
  additionalProperties: false
  properties:
    deviceId: { type: string, examples: ["device-7f3a91"] }
    clientClockAt:
      type: string
      format: date-time
      description: >
        Device clock at drain time, used to measure skew. Skew is reported and
        logged, never used to rewrite `occurredAt`, which stays the device clock.
      examples: ["2026-09-30T06:02:11Z"]
    events:
      type: array
      minItems: 1
      items: { $ref: "./stops.yaml#/StopEvent" }

SyncBatchResult:
  allOf:
    - $ref: "./stops.yaml#/SubmitEventsResult"
    - type: object
      required: [clockSkewMs, serverSeq]
      properties:
        clockSkewMs:
          type: integer
          description: >
            Server time minus `clientClockAt`, in ms, clamped to the 32-bit
            range (a handset with a reset clock reports decades).
          examples: [842]
        serverSeq:
          type: integer
          format: int64
          description: Highest server sequence assigned in this batch; use as the next `sinceSeq`.
          examples: [10428]
