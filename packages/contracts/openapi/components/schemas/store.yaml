# Owner: BE2
#
# The store manager's read model. These shapes already existed as TypeScript in
# apps/api/src/services/store.ts and were simply never routed — loadStoreOrders
# and loadIncomingDelivery were written, tested in spirit, and called by
# nothing. This file is that model, stated in the contract.

StoreOrderState:
  type: string
  description: >
    The narrower projection a store manager sees. Deliberately not OrderStatus:
    an outlet has no use for the difference between PLANNED and LOADED, and
    several OrderStatus values are never written at all.
  enum: [queued, planned, on_the_way, delivered, deferred, cancelled]

StoreDeferral:
  type: object
  description: Why an order moved, and where it moved to. Shown to the outlet verbatim.
  required: [reasonCode, acknowledged]
  properties:
    reasonCode: { type: string, examples: ["REEFER_FULL"] }
    rolledToDate: { oneOf: [{ $ref: "./common.yaml#/DateOnly" }, { type: "null" }] }
    acknowledged: { type: boolean }

StoreOrder:
  type: object
  required: [id, ref, brand, tempRequirement, units, requestedDate, state, receiptConfirmed]
  properties:
    id: { type: string, examples: ["clx0ord1a2b3c4d5e6f7g8h9"] }
    ref: { type: string, examples: ["S1-082"] }
    brand: { $ref: "./common.yaml#/Brand" }
    tempRequirement: { $ref: "./common.yaml#/TempRequirement" }
    units: { type: integer, examples: [69] }
    volumeM3: { type: number, examples: [2.1] }
    weightKg: { type: number, examples: [320] }
    requestedDate: { $ref: "./common.yaml#/DateOnly" }
    state: { $ref: "#/StoreOrderState" }
    etaAt:
      description: >
        Planned arrival, as a wall-clock time. Null until the order is on a
        published trip. This is a plan, not an observation — a client showing
        it must not imply the vehicle has been seen there.
      oneOf: [{ $ref: "./common.yaml#/ClockTime" }, { type: "null" }]
    vehicleId: { oneOf: [{ type: string }, { type: "null" }] }
    stopsBefore:
      description: How many stops the vehicle serves before this one. The honest substitute for a position.
      oneOf: [{ type: integer }, { type: "null" }]
    tripStopId: { oneOf: [{ type: string }, { type: "null" }] }
    deliveredUnits: { oneOf: [{ type: integer }, { type: "null" }] }
    receiptConfirmed: { type: boolean }
    deferral: { oneOf: [{ $ref: "#/StoreDeferral" }, { type: "null" }] }

DeliveryStep:
  type: object
  description: >
    One of the five fixed delivery steps. Fixed, because the product has no
    continuous vehicle position to animate — see DOMAIN.md.
  required: [key, label, state]
  properties:
    key: { type: string, examples: ["en_route"] }
    label: { type: string, examples: ["En route"] }
    detail:
      description: The time or count under the label. Null when there is nothing honest to say.
      oneOf: [{ type: string }, { type: "null" }]
    state: { type: string, enum: [done, current, todo] }

IncomingDelivery:
  type: object
  required: [orderId, ref, brand, tempRequirement, units, vehicleId, districtName, depotCode, stopsBefore, legMinutes, departed, steps]
  properties:
    orderId: { type: string }
    ref: { type: string, examples: ["S1-082"] }
    brand: { $ref: "./common.yaml#/Brand" }
    tempRequirement: { $ref: "./common.yaml#/TempRequirement" }
    units: { type: integer, examples: [69] }
    etaAt: { oneOf: [{ $ref: "./common.yaml#/ClockTime" }, { type: "null" }] }
    vehicleId: { type: string, examples: ["VEH025"] }
    districtName: { type: string, examples: ["Puttalam"] }
    depotCode: { type: string, examples: ["Peliyagoda"] }
    stopsBefore: { type: integer, examples: [1] }
    legMinutes:
      description: Planned depot-to-district leg from the district travel table. Free-flow, no traffic model.
      type: integer
      examples: [96]
    minutesAway:
      description: >
        Minutes until the planned arrival, and only when that is a sane number —
        positive and under four hours. Null otherwise, because a wrong countdown
        is worse than none.
      oneOf: [{ type: integer }, { type: "null" }]
    departed: { type: boolean }
    steps:
      type: array
      items: { $ref: "#/DeliveryStep" }

Weather:
  type: object
  description: >
    Current conditions at the outlet's district, shown as context beside the
    operational figures. Nothing in the allocator reads it. `live` is false when
    the upstream fetch failed and the value fell back to the seeded calendar's
    monsoon flag — a client should say so rather than present it as observed.
  required: [place, label, kind, live]
  properties:
    place: { type: string, examples: ["Puttalam"] }
    temperatureC: { oneOf: [{ type: number }, { type: "null" }], examples: [28] }
    label: { type: string, examples: ["Light rain"] }
    kind: { type: string, enum: [clear, cloudy, rain, storm, fog] }
    live: { type: boolean }
    observedAt: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }

StoreToday:
  type: object
  description: >
    Everything the Today screen renders, in one request. Assembled server-side
    because the five-step tracker, the stop count and the countdown all derive
    from the same trip and must not be able to disagree with each other.
  required: [outletId, date, receivingWindowOpen, receivingWindowClose, accessNote, orders, counts]
  properties:
    outletId: { type: string, examples: ["OUT074"] }
    outletName: { type: string, examples: ["Fresh Puttalam"] }
    brand: { $ref: "./common.yaml#/Brand" }
    date: { $ref: "./common.yaml#/DateOnly" }
    receivingWindowOpen: { $ref: "./common.yaml#/ClockTime" }
    receivingWindowClose: { $ref: "./common.yaml#/ClockTime" }
    accessNote: { type: string, examples: ["Use the rear dock. Security check at the gate."] }
    incoming: { oneOf: [{ $ref: "#/IncomingDelivery" }, { type: "null" }] }
    orders:
      description: Today's orders for this outlet, newest first.
      type: array
      items: { $ref: "#/StoreOrder" }
    counts:
      type: object
      required: [expected, confirmed, pending, issues]
      properties:
        expected: { type: integer, examples: [2] }
        confirmed: { type: integer, examples: [0] }
        pending:
          description: Delivered but not yet confirmed by the outlet.
          type: integer
          examples: [1]
        issues: { type: integer, examples: [0] }
    weather: { oneOf: [{ $ref: "#/Weather" }, { type: "null" }] }
