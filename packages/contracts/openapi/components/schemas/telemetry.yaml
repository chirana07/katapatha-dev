# Owner: Slice V
#
# What the field reports back. A ping is whatever position a driver's phone
# managed to send; a chiller reading is a person's reading of a gauge. Neither
# is a sensor stream, and neither may be described as live.

ChillerSource:
  type: string
  enum: [LOADER_AT_BAY, DRIVER_ON_ARRIVAL]
  description: >
    Where the gauge was read. LOADER_AT_BAY is recorded by a loader or
    dispatcher; DRIVER_ON_ARRIVAL by the driver.

PingBatchRequest:
  type: object
  required: [pings]
  additionalProperties: false
  properties:
    pings:
      type: array
      minItems: 1
      maxItems: 50
      items:
        type: object
        required: [clientPingId, lat, lng, recordedAt]
        additionalProperties: false
        properties:
          clientPingId:
            type: string
            minLength: 8
            maxLength: 64
            description: Minted by the phone. A resent ping with the same id is counted as a duplicate, not stored twice.
            examples: ["01JBX3Q7W2R8M5T9K4N6P0ZYAB"]
          lat: { type: number, minimum: -90, maximum: 90, examples: [7.9034] }
          lng: { type: number, minimum: -180, maximum: 180, examples: [79.8312] }
          accuracyM: { type: number, minimum: 0, examples: [18] }
          recordedAt:
            type: string
            format: date-time
            description: The phone's clock when the fix was taken. More than 5 minutes ahead of the server is refused.

PingBatchResult:
  type: object
  required: [accepted, duplicates]
  properties:
    accepted: { type: integer, description: "Pings stored by this request.", examples: [2] }
    duplicates: { type: integer, description: "Pings already stored under the same clientPingId.", examples: [1] }

ChillerReadingRequest:
  type: object
  required: [tempC, source]
  additionalProperties: false
  properties:
    tempC: { type: number, minimum: -30, maximum: 40, examples: [3.8] }
    source: { $ref: "./telemetry.yaml#/ChillerSource" }
    tripStopId:
      type: string
      description: The stop the reading was taken at, for an arrival reading. Must belong to the trip.
    note: { type: string, maxLength: 200, examples: ["Door opened twice at the last stop"] }
    clientReadingId:
      type: string
      minLength: 8
      maxLength: 64
      description: Minted by the client. Sending the same id again returns the existing reading with 200 instead of creating another.
    recordedAt:
      type: string
      format: date-time
      description: When the gauge was read. Defaults to now; more than 5 minutes ahead of the server is refused.

ChillerReadingResponse:
  type: object
  required: [id, tripId, vehicleId, tempC, targetMinC, targetMaxC, inRange, source, recordedAt, recordedByName]
  properties:
    id: { type: string, examples: ["clx0chr1a2b3c4d5e6f7g8h9"] }
    tripId: { type: string, examples: ["clx0trp1a2b3c4d5e6f7g8h9"] }
    vehicleId: { type: string, examples: ["VEH014"] }
    tempC: { type: number, examples: [3.8] }
    targetMinC: { type: number, description: "The band copied onto the reading when it was taken.", examples: [2] }
    targetMaxC: { type: number, examples: [5] }
    inRange: { type: boolean, description: "tempC within the stored band, both ends included." }
    source: { $ref: "./telemetry.yaml#/ChillerSource" }
    recordedAt: { type: string, format: date-time }
    recordedByName: { type: [string, "null"], examples: ["Ranjith Silva"] }
