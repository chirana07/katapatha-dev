# Owner: BE2
PlaceOrdersRequest:
  type: object
  description: >
    The store manager says what they want; outlet, brand, district and depot are
    derived server-side from the session — never trusted from the body.


    Exactly one of `items` and `lines` must be present (422 `VALIDATION_FAILED`
    otherwise).


    `items` orders real products from the catalogue. They are grouped by the
    product's temperature into one order per temperature, so a mixed basket
    becomes two orders, exactly as ambient and chilled `lines` do. Each order's
    units are the sum of its quantities and its weight and volume are the sum of
    each product's real size times its quantity, snapshotted onto the order's
    lines. Rule 5 (an order travels whole) is checked against that order's own
    blended size.


    `lines` is the older units-only form, kept working: weight and volume are
    estimated from the outlet's own history and the order has no `items`.
  required: [requestId, forDate]
  additionalProperties: false
  oneOf:
    - required: [items]
    - required: [lines]
  properties:
    requestId:
      type: string
      format: uuid
      description: Idempotency key. Replaying the same requestId returns the original result.
      examples: ["9f1c1d7e-2a4b-4c8d-9e0f-1a2b3c4d5e6f"]
    forDate: { $ref: "./common.yaml#/DateOnly" }
    items:
      type: array
      description: >
        Products and quantities. Errors: 422 `PRODUCT_NOT_FOUND` (unknown id),
        422 `PRODUCT_INACTIVE` (deactivated), 422 `PRODUCT_NOT_AVAILABLE_FOR_BRAND`
        (restricted to another brand), 422 `ORDER_TOO_LARGE` (as for lines).
        The same product listed twice is 422 `VALIDATION_FAILED`.
      minItems: 1
      maxItems: 100
      items:
        type: object
        required: [productId, quantity]
        additionalProperties: false
        properties:
          productId: { type: string, minLength: 1, examples: ["clx0prd1a2b3c4d5e6f7g8h9"] }
          quantity: { type: integer, minimum: 1, maximum: 10000, examples: [20] }
    lines:
      type: array
      minItems: 1
      items:
        type: object
        required: [tempRequirement, units]
        additionalProperties: false
        properties:
          tempRequirement: { $ref: "./common.yaml#/TempRequirement" }
          units: { type: integer, minimum: 1, maximum: 10000, examples: [120] }

Order:
  type: object
  required: [id, ref, outletId, brand, tempRequirement, units, requestedDate, status]
  properties:
    id: { type: string, examples: ["clx0ord1a2b3c4d5e6f7g8h9"] }
    ref: { type: string, examples: ["ORD-004312"] }
    outletId: { type: string, examples: ["OUT074"] }
    brand: { $ref: "./common.yaml#/Brand" }
    districtName: { type: string, examples: ["Colombo"] }
    tempRequirement: { $ref: "./common.yaml#/TempRequirement" }
    units: { type: integer, examples: [120] }
    weightKg: { type: number, examples: [860.4] }
    volumeM3: { type: number, examples: [4.32] }
    windowOpen: { $ref: "./common.yaml#/ClockTime" }
    windowClose: { $ref: "./common.yaml#/ClockTime" }
    requestedDate: { $ref: "./common.yaml#/DateOnly" }
    status: { $ref: "./common.yaml#/OrderStatus" }
    storeState:
      type: string
      description: The narrower projection a store manager sees.
      enum: [queued, planned, on_the_way, delivered, deferred, cancelled]
    items:
      description: >
        What the order contains, when it was placed from products: the name and
        unit label as they were at placement. Absent or empty for orders placed
        as units only and for the competition's orders. Additive. Read-only
        context: planning, load checks and delivery still count `units`.
      type: array
      items: { $ref: "./products.yaml#/OrderItem" }
    deferral:
      description: >
        Present once a plan that deferred this order is published: the
        dispatcher's reason and the operating day it moves to. `rolledToDate`
        is null when no vehicle in the fleet could carry the order as it
        stands, so no next run is promised. Additive (CONVENTIONS.md rule 8).
      oneOf:
        - type: "null"
        - type: object
          required: [reasonCode, rolledToDate]
          properties:
            reasonCode: { type: string, examples: ["REEFER_FULL"] }
            rolledToDate:
              oneOf:
                - type: "null"
                - $ref: "./common.yaml#/DateOnly"

ReceiptRequest:
  type: object
  required: [unitsReceived, matches]
  additionalProperties: false
  properties:
    unitsReceived: { type: integer, minimum: 0, examples: [120] }
    matches: { type: boolean, examples: [true] }
    issueKind:
      type: [string, "null"]
      enum: [ITEMS_MISSING, ITEMS_DAMAGED, ARRIVED_WARM, WRONG_ITEMS, null]
    note: { type: [string, "null"], examples: [null] }

Receipt:
  type: object
  required: [orderId, confirmedAt, unitsReceived, matches]
  properties:
    orderId: { type: string, examples: ["clx0ord1a2b3c4d5e6f7g8h9"] }
    confirmedAt: { type: string, format: date-time, examples: ["2026-09-30T05:41:00Z"] }
    unitsReceived: { type: integer, examples: [120] }
    matches: { type: boolean, examples: [true] }

OrderLimit:
  type: object
  required: [m3PerUnit, kgPerUnit, maxUnitsPerOrder]
  properties:
    m3PerUnit: { type: number, examples: [0.1125] }
    kgPerUnit: { type: number, examples: [8] }
    maxUnitsPerOrder:
      type: integer
      description: 0 when no vehicle at the depot can carry this temperature to the outlet.
      examples: [302]

OrderLimits:
  type: object
  required: [chilled, frozen, ambient]
  properties:
    chilled: { $ref: "./orders.yaml#/OrderLimit" }
    frozen: { $ref: "./orders.yaml#/OrderLimit" }
    ambient: { $ref: "./orders.yaml#/OrderLimit" }
