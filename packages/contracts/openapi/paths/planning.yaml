# Owner: BE2
planningDays:
  get:
    operationId: listPlanningDays
    summary: The order queue state for a date
    tags: [planning]
    parameters:
      - $ref: "../components/parameters/common.yaml#/Date"
      - $ref: "../components/parameters/common.yaml#/DepotCode"
    responses:
      "200":
        description: Planning day.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "../components/schemas/planning.yaml#/PlanningDay" }
            example:
              - id: "clx0pd1a2b3c4d5e6f7g8h9i"
                date: "2026-10-01"
                depotCode: "Peliyagoda"
                status: OPEN
                cutoffAt: "16:00"
      "401": { $ref: "../components/responses/common.yaml#/Unauthorized" }
      "422": { $ref: "../components/responses/common.yaml#/ValidationFailed" }

closure:
  parameters:
    - name: planningDayId
      in: path
      required: true
      schema: { type: string }
  post:
    operationId: closeOrderQueue
    summary: Close the order queue for the day
    description: >
      OPEN to CLOSED, writing a queue snapshot. Replaying returns 200 with the
      current state rather than an error — closing twice is not a mistake worth
      blocking a dispatcher for.
    tags: [planning]
    responses:
      "200":
        description: Queue closed (or already closed).
        content:
          application/json:
            schema: { $ref: "../components/schemas/planning.yaml#/PlanningDay" }
            example:
              id: "clx0pd1a2b3c4d5e6f7g8h9i"
              date: "2026-10-01"
              depotCode: "Peliyagoda"
              status: CLOSED
              cutoffAt: "16:00"
      "403": { $ref: "../components/responses/common.yaml#/Forbidden" }
      "404": { $ref: "../components/responses/common.yaml#/NotFound" }

plans:
  get:
    operationId: listPlans
    summary: Plans for a date
    tags: [planning]
    parameters:
      - $ref: "../components/parameters/common.yaml#/Date"
      - $ref: "../components/parameters/common.yaml#/DepotCode"
    responses:
      "200":
        description: Plans.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "../components/schemas/planning.yaml#/PlanSummary" }
            example:
              - planId: "clx0pln1a2b3c4d5e6f7g8h"
                status: DRAFT
                stats: { orders: 85, served: 78, deferred: 7, tripsBuilt: 14, hash: "a3f9c1e70b4d2856" }
      "401": { $ref: "../components/responses/common.yaml#/Unauthorized" }
      "422": { $ref: "../components/responses/common.yaml#/ValidationFailed" }
  post:
    operationId: createPlan
    summary: Run the allocator and produce a draft plan
    description: >
      Also the re-run path: an existing DRAFT for the day is replaced, so
      re-running is free and leaves no trail of half-plans. Requires the
      planning day to be CLOSED or PLANNING: an OPEN queue answers 409
      `QUEUE_OPEN`, and a day whose plan is already published answers 409
      `ALREADY_PUBLISHED` rather than putting a second draft beside the live
      plan. No planning day answers 404 `NO_PLANNING_DAY`.
    tags: [planning]
    parameters:
      - $ref: "../components/parameters/common.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/schemas/planning.yaml#/CreatePlanRequest" }
    responses:
      "201":
        description: Draft plan created.
        content:
          application/json:
            schema: { $ref: "../components/schemas/planning.yaml#/PlanSummary" }
            example:
              planId: "clx0pln1a2b3c4d5e6f7g8h"
              status: DRAFT
              stats: { orders: 85, served: 78, deferred: 7, tripsBuilt: 14, hash: "a3f9c1e70b4d2856" }
      "403": { $ref: "../components/responses/common.yaml#/Forbidden" }
      "409": { $ref: "../components/responses/common.yaml#/Conflict" }
      "422": { $ref: "../components/responses/common.yaml#/ValidationFailed" }

planItem:
  parameters:
    - name: planId
      in: path
      required: true
      schema: { type: string }
  get:
    operationId: getPlan
    summary: The plan board
    tags: [planning]
    responses:
      "200":
        description: Plan with trips and assignments.
        content:
          application/json:
            schema:
              type: object
              required: [planId, status, stats, trips, deferrals]
              properties:
                planId: { type: string }
                date:
                  description: The planning day this plan belongs to. Additive.
                  allOf: [{ $ref: "../components/schemas/common.yaml#/DateOnly" }]
                status: { type: string, enum: [DRAFT, PUBLISHED, SUPERSEDED] }
                stats: { $ref: "../components/schemas/planning.yaml#/PlanStats" }
                trips:
                  type: array
                  items: { $ref: "../components/schemas/trips.yaml#/Trip" }
                meters:
                  type: array
                  description: >
                    Per-vehicle utilisation as built. Empty for a plan made
                    before the allocator's meters were kept. Additive.
                  items: { $ref: "../components/schemas/planning.yaml#/VehicleMeter" }
                deferrals:
                  type: array
                  description: >
                    The DEFERRED assignments on this plan, each with the
                    reason code the dispatcher has attached (null when
                    still pending). The dispatcher UI confirms every
                    pending deferral through PUT /plans/{planId}/deferrals
                    before the publication gate opens.
                  items: { $ref: "../components/schemas/planning.yaml#/DeferralRow" }
            example:
              planId: "clx0pln1a2b3c4d5e6f7g8h"
              date: "2026-04-09"
              status: DRAFT
              stats: { orders: 85, served: 78, deferred: 7, tripsBuilt: 14, hash: "a3f9c1e70b4d2856" }
              trips:
                - id: "clx0trp1a2b3c4d5e6f7g8h"
                  vehicleId: "VEH043"
                  tripNo: 1
                  brand: Fresh
                  districtName: "Colombo"
                  wave: PREDAWN
                  status: PLANNED
                  plannedDepartAt: "03:30"
                  plannedMinutes: 212
                  sumWeightKg: 3210.5
                  sumVolumeM3: 16.8
              meters:
                - { vehicleId: VEH043, tripsUsed: 2, predawnUsedMin: 212, predawnBudgetMin: 240, daytimeUsedMin: 188.5, daytimeBudgetMin: 360, fuelCommittedL: 212.4, fuelQuotaL: 300 }
              deferrals:
                - assignmentId: "clx0asg1a2b3c4d5e6f7g8h"
                  orderId: "clx0ord1a2b3c4d5e6f7g8h9"
                  orderRef: "ORD-004312"
                  reasonCode: null
                  note: null
                  order:
                    outletId: "OUT074"
                    outletName: "Puttalam"
                    brand: Fresh
                    districtName: "Puttalam"
                    tempRequirement: CHILLED
                    units: 205
                    volumeM3: 2.6
                    windowOpen: "05:30"
                    windowClose: "08:00"
                    deferredYesterday: false
                  cause:
                    rejectionCode: NO_REEFER_AVAILABLE
                    permanent: false
                    explanation:
                      - { code: NO_REEFER_AVAILABLE, count: 14, sample: "VEH025" }
                    nearMiss: null
                    suggestion: "fits if VEH003 returns from the workshop"
                  suggestedReasonCode: REEFER_FULL
                  movesTo: { date: "2026-04-10", windowOpen: "05:30", windowClose: "08:00", firstOnRun: true }
                  notifyRecipient: { name: "Fathima Rizvi", outletId: "OUT074" }
      "403": { $ref: "../components/responses/common.yaml#/Forbidden" }
      "404": { $ref: "../components/responses/common.yaml#/NotFound" }

planValidation:
  parameters:
    - name: planId
      in: path
      required: true
      schema: { type: string }
  get:
    operationId: getPlanValidation
    summary: Run the shared validator against a plan
    description: >
      The same isomorphic validator the allocator self-checks with and that
      publication gates on. Exposing it lets the board show violations live
      instead of discovering them at publish time.
    tags: [planning]
    parameters:
      - name: stage
        in: query
        required: false
        schema: { type: string, enum: [draft, publish], default: draft }
    responses:
      "200":
        description: Validation result.
        content:
          application/json:
            schema: { $ref: "../components/schemas/planning.yaml#/ValidationResult" }
            example:
              stage: draft
              blocking: false
              violations:
                - code: HIGH_PRIORITY_DEFERRED
                  severity: warning
                  message: "OUT074 was deferred yesterday and is deferred again."
                  tripId: null
                  orderRef: "ORD-004312"
                  overridable: false
      "403": { $ref: "../components/responses/common.yaml#/Forbidden" }
      "404": { $ref: "../components/responses/common.yaml#/NotFound" }

planDeferrals:
  parameters:
    - name: planId
      in: path
      required: true
      schema: { type: string }
  put:
    operationId: confirmDeferrals
    summary: Attach a reason code to each deferred order
    description: >
      Every deferral carries a reason. Publication is blocked while any deferred
      order lacks one.
    tags: [planning]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/schemas/planning.yaml#/ConfirmDeferralsRequest" }
    responses:
      "200":
        description: Reasons recorded.
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: integer }
            example: { confirmed: 7 }
      "403": { $ref: "../components/responses/common.yaml#/Forbidden" }
      "422": { $ref: "../components/responses/common.yaml#/ValidationFailed" }

planDeferralAlternatives:
  parameters:
    - name: planId
      in: path
      required: true
      schema: { type: string }
    - name: assignmentId
      in: path
      required: true
      schema: { type: string }
  get:
    operationId: getDeferralAlternatives
    summary: The other orders competing for a deferred order's lane
    description: >
      "Why this order and not another." The orders sharing the deferred
      order's lane (brand + district, the allocator's own grouping), ranked by
      the same priority policy the allocator used. Read-only; feeds the
      dispatcher's "Defer order" drawer.
    tags: [planning]
    responses:
      "200":
        description: The deferred order and its competitors.
        content:
          application/json:
            schema: { $ref: "../components/schemas/planning.yaml#/LaneAlternatives" }
            example:
              lane: { brand: Fresh, districtName: "Puttalam", resource: refrigerated vehicle, competing: 2 }
              items:
                - { orderRef: "ORD-004312", outletId: "OUT074", outletName: "Puttalam", isThisOrder: true, decision: DEFERRED, rank: 3, impact: lowest, why: "window shuts 08:00" }
                - { orderRef: "ORD-004298", outletId: "OUT033", outletName: null, isThisOrder: false, decision: SERVED, rank: 1, impact: protected, why: "deferred yesterday, window shuts 08:00" }
      "403": { $ref: "../components/responses/common.yaml#/Forbidden" }
      "404": { $ref: "../components/responses/common.yaml#/NotFound" }

planPublication:
  parameters:
    - name: planId
      in: path
      required: true
      schema: { type: string }
  post:
    operationId: publishPlan
    summary: Publish the plan
    description: >
      An atomic one-time claim. Publishing commits fuel, notifies deferred
      outlets, and moves served orders to PLANNED. A second attempt is a 409,
      not a silent success.
    tags: [planning]
    parameters:
      - $ref: "../components/parameters/common.yaml#/IdempotencyKey"
    responses:
      "201":
        description: Published.
        content:
          application/json:
            schema: { $ref: "../components/schemas/planning.yaml#/PlanSummary" }
            example:
              planId: "clx0pln1a2b3c4d5e6f7g8h"
              status: PUBLISHED
              stats: { orders: 85, served: 78, deferred: 7, tripsBuilt: 14, hash: "a3f9c1e70b4d2856" }
      "403": { $ref: "../components/responses/common.yaml#/Forbidden" }
      "409": { $ref: "../components/responses/common.yaml#/Conflict" }
      "422": { $ref: "../components/responses/common.yaml#/ValidationFailed" }
