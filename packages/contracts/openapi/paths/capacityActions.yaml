                    "depotCode": "Peliyagoda",
                    "brand": null,
                    "kind": "HIRE_RELIEF_VEHICLE",
                    "title": "Hire 1 reefer for 13–18 Apr",
                    "detail": "Peliyagoda · covers 2 of the 3 short trips a day in W16",
                    "params": {
                      "count": 1,
