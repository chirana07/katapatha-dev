# Owner: BE3
collection:
  get:
    operationId: listCapacityActions
    summary: Capacity actions for a week, or the whole forecast horizon
    description: >
      Dispatcher only, own depot. Proposals are derived from the forecast for weeks
      with a reefer shortfall (hire, recall from workshop, ask Fresh stores to order
      early, move the delivery day, raise a fuel quota that binds) and persisted
      the first time a week is read. Reading again returns the same rows: it never
      creates a duplicate, and an open proposal is refreshed in place if the
      week's numbers move. A decided action is never altered.

      Give both `isoYear` and `isoWeek`, or neither (the stored forecast horizon).
    tags: [capacity]
    parameters:
      - name: isoYear
        in: query
        required: false
        schema: { type: string, pattern: '^20\d{2}$', examples: ["2026"] }
      - name: isoWeek
        in: query
        required: false
        schema: { type: string, pattern: '^([1-9]|[1-4]\d|5[0-3])$', examples: ["16"] }
    responses:
      "200":
        description: The week's actions, oldest week first.
        content:
          application/json:
            schema: { $ref: "../components/schemas/capacityActions.yaml#/CapacityActionList" }
            example:
              {
                "depotCode": "Peliyagoda",
                "isoYear": 2026,
                "isoWeek": 16,
                "items": [
                  {
                    "id": "cmuslkzkk0000ufehamunrppq",
                    "isoYear": 2026,
                    "isoWeek": 16,
                    "depotCode": "Peliyagoda",
                    "brand": null,
                    "kind": "RECALL_FROM_WORKSHOP",
                    "title": "Recall VEH103 from the workshop for 13–18 Apr",
                    "detail": "Peliyagoda · frees 2 trips a day in W16",
                    "params": {
                      "count": 1,
                      "dates": [
                        "2026-04-15",
                        "2026-04-16"
                      ],
                      "vehicleIds": [
                        "VEH103"
                      ]
                    },
                    "expectedRelief": {
                      "basis": "1 reefer back in service, two trips a day each",
                      "estimate": false,
                      "tripsPerDay": 2
                    },
                    "status": "PROPOSED",
                    "stale": false,
                    "availableDecisions": [
                      "APPROVE",
                      "REJECT"
                    ],
                    "decidedBy": null,
                    "decidedAt": null,
