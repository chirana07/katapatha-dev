decision:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string }
  post:
    operationId: decideCapacityAction
    summary: Approve, reject or apply a capacity action
    description: >
      PROPOSED -> APPROVED (APPROVE); PROPOSED or APPROVED -> REJECTED (REJECT);
      APPROVED -> APPLIED (APPLY). Anything else is a 409; APPLY on a PROPOSED action
      is `ACTION_NOT_APPROVED`.

      APPLY does only what the system can truly do. RECALL_FROM_WORKSHOP clears the
      reefer's workshop days in the week (days whose plan is already published are
      left alone). RAISE_FUEL_QUOTA raises that week's fuel quota in the ledger,
      never lowers it. HIRE_RELIEF_VEHICLE, SHIFT_BRAND_DAY and PRE_BUILD_ORDERS are
      recorded only, and `consequences` says plainly that nothing else changes.

      The status change and APPLY's effect happen in one transaction. Every decision
      is written to the decision log with entityType `CapacityAction`.
      An action in another depot answers 403, the same as one that does not exist.
    tags: [capacity]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/schemas/capacityActions.yaml#/CapacityDecisionRequest" }
          example: {"decision": "APPROVE", "note": "Book by 10 Apr"}
    responses:
      "200":
        description: The action after the decision, and what the decision did.
        content:
          application/json:
            schema: { $ref: "../components/schemas/capacityActions.yaml#/CapacityDecisionResult" }
            examples:
              approved:
                summary: Approved; nothing has changed yet
                value:
                  {
                    "action": {
                      "id": "cmuslkzkk0001ufeh07xkwwou",
                      "isoYear": 2026,
                      "isoWeek": 16,
                      "depotCode": "Peliyagoda",
                      "brand": null,
                      "kind": "HIRE_RELIEF_VEHICLE",
                      "title": "Hire 1 reefer for 13–18 Apr",
                      "detail": "Peliyagoda · covers 2 of the 3 short trips a day in W16",
                      "params": {
                        "count": 1,
                        "toDate": "2026-04-18",
                        "fromDate": "2026-04-13",
                        "vehicleTemp": "reefer",
                        "shortfallTripsPerDay": 3
                      },
                      "expectedRelief": {
                        "basis": "1 hired reefer, two trips a day each",
                        "estimate": false,
                        "tripsPerDay": 2
                      },
                      "status": "APPROVED",
                      "stale": false,
                      "availableDecisions": [
                        "APPLY",
                        "REJECT"
                      ],
                      "decidedBy": "Nimal Perera",
                      "decidedAt": "2026-04-07T08:12:40.000Z",
                      "reasonCode": null,
                      "note": "Book by 10 Apr",
                      "appliesFromDate": "2026-04-13",
                      "createdAt": "2026-10-03T16:19:44.277Z"
                    },
                    "consequences": [
                      "Approved. Nothing has changed yet; apply it when you are ready."
                    ]
                  }
              appliedRecordOnly:
                summary: Applying a hire is recorded only
                value:
                  {
                    "action": {
                      "id": "cmuslkzkk0001ufeh07xkwwou",
                      "isoYear": 2026,
                      "isoWeek": 16,
                      "depotCode": "Peliyagoda",
                      "brand": null,
                      "kind": "HIRE_RELIEF_VEHICLE",
                      "title": "Hire 1 reefer for 13–18 Apr",
                      "detail": "Peliyagoda · covers 2 of the 3 short trips a day in W16",
                      "params": {
                        "count": 1,
                        "toDate": "2026-04-18",
                        "fromDate": "2026-04-13",
                        "vehicleTemp": "reefer",
                        "shortfallTripsPerDay": 3
                      },
                      "expectedRelief": {
                        "basis": "1 hired reefer, two trips a day each",
                        "estimate": false,
                        "tripsPerDay": 2
                      },
                      "status": "APPLIED",
                      "stale": false,
                      "availableDecisions": [],
                      "decidedBy": "Nimal Perera",
                      "decidedAt": "2026-04-07T08:12:40.000Z",
                      "reasonCode": null,
                      "note": "Book by 10 Apr",
                      "appliesFromDate": "2026-04-13",
                      "createdAt": "2026-10-03T16:19:44.277Z"
                    },
                    "consequences": [
                      "Recorded only. This system does not book or register a hired vehicle: nothing else changes, and the forecast still shows the shortfall until a vehicle is added to the fleet."
                    ]
                  }
      "401": { $ref: "../components/responses/common.yaml#/Unauthorized" }
      "403": { $ref: "../components/responses/common.yaml#/Forbidden" }
      "409": { $ref: "../components/responses/common.yaml#/Conflict" }
      "422": { $ref: "../components/responses/common.yaml#/ValidationFailed" }
