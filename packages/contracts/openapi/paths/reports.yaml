capacityForecast:
  get:
    operationId: getReportsCapacityForecast
    summary: Weekly demand vs reefer capacity, with recommended actions
    description: >
      Weekly demand against reefer capacity for the depot, with the forecast's own
      measured error and the persisted recommended actions. Weeks with history are
      `actual`; weeks with a stored forecast are `forecast`. Reefer trips a day needed
      = chilled m3 per operating day over the planned load per trip (mean reefer capacity
      x the fill observed in the competition training data); capacity = available reefers
      x 2 trips. Each assumption is listed in `assumptions`.
      
      Reading this creates the week's capacity-action proposals the first time it is
      called (once only), so `recommendedActions` carry ids a decision can name.
      When `historySource.kind` is `synthetic` every volume is generated for the
      development fixture, not competition data.
      
      Dispatcher only, own depot only.
    tags: [reports]
    parameters:
      - name: from
        in: query
        required: false
        schema: { $ref: "../components/schemas/common.yaml#/DateOnly" }
        description: A date in the first week wanted. With neither `from` nor `to`, eight weeks starting two weeks before the stored forecast.
      - name: to
        in: query
        required: false
        schema: { $ref: "../components/schemas/common.yaml#/DateOnly" }
        description: A date in the last week wanted. At most 53 weeks.
      - name: depot
        in: query
        required: false
        schema: { type: string }
        description: Must be the caller's own depot if given (403 otherwise).
