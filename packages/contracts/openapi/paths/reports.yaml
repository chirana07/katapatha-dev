# Owner: BE3
overview:
  get:
    operationId: getReportsOverview
    summary: Headline delivery performance for the depot
    description: >
      Headline tiles, the daily on-time series, the busiest outlets and the top exceptions.
      Orders delivered vs planned and deferred; fleet utilisation against the 80% target
      (only from trips published in this system); discrepancies as a count and a share of
      orders (only for days run in this system).
      
            Dispatcher only, and only for the caller's own depot (the design shows every depot;
            a dispatcher is depot-scoped, so a `depot` naming another is a 403).
      
            Days run in this system and days from the analytics history are merged by day, never
            both for one date. "On time" means the vehicle arrived no later than the outlet's
            window closed. A figure the data cannot support is null with a `note`.
    tags: [reports]
    parameters:
      - name: from
        in: query
        required: false
        schema: { $ref: "../components/schemas/common.yaml#/DateOnly" }
        description: First day of the range. With neither `from` nor `to`, the seven days ending at the newest day with data.
      - name: to
        in: query
        required: false
        schema: { $ref: "../components/schemas/common.yaml#/DateOnly" }
        description: Last day of the range, inclusive. At most 366 days after `from`.
      - name: depot
        in: query
        required: false
        schema: { type: string }
        description: Must be the caller's own depot if given; a dispatcher cannot read another depot's reports (403).
    responses:
      "200":
        description: The report.
        content:
          application/json:
            schema: { $ref: "../components/schemas/reports.yaml#/ReportsOverview" }
