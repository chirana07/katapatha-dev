                      followUp: { forDate: "2026-09-30", units: 4, label: "Add the 4 missing units to Wed, 30 Sept's orders" }
                      consequences:
                        - { audience: loader, title: "Loader · Ranjith Silva", detail: "The departure block is lifted: VEH017 can be marked ready with 16 of 20 units." }
                        - { audience: store, title: "Store · Kandy City Centre", detail: "Told before departure that 16 of 20 units are on the way for S1-082." }
