# Owner: BE2 (Phase 1, slice X)
collection:
  get:
    operationId: listExceptions
    summary: Everything that needs a decision before or during delivery
    description: >
      Dispatcher only, own depot. One list over loading shortfalls, chiller
      readings, the draft plan's validation, late trips, Lamp Mode vehicles
      and reported problems, with the figures for the tiles and tabs.
      `date` defaults to today in Asia/Colombo; `status` to `open`.

      The summary describes the whole day and ignores the filters.

      Everything is derived from what the field has recorded, and says so: a
      chiller figure is a named person's gauge reading, lateness is measured
      at the last stop the driver recorded arriving at, and Lamp Mode shows the
      last reliable update with its time. Nothing here is live tracking.
    tags: [exceptions]
    parameters:
      - name: date
        in: query
        required: false
        schema: { $ref: "../components/schemas/common.yaml#/DateOnly" }
      - name: status
        in: query
        required: false
        schema: { type: string, enum: [open, resolved, all], default: open }
      - name: category
        in: query
        required: false
        schema: { $ref: "../components/schemas/exceptions.yaml#/ExceptionCategory" }
      - name: severity
        in: query
        required: false
        schema: { $ref: "../components/schemas/exceptions.yaml#/ExceptionSeverity" }
      - name: q
        in: query
        required: false
        description: Matches order ref, vehicle, outlet id or name, and the title.
        schema: { type: string, maxLength: 100 }
    responses:
      "200":
        description: The day's exceptions and summary.
        content:
          application/json:
            schema: { $ref: "../components/schemas/exceptions.yaml#/ExceptionList" }
            example:
              date: "2026-09-29"
              summary:
                open: 3
                critical: 1
                ordersAffected: 4
                outletsAffected: 3
                vehiclesAffected: 2
                resolvedToday: 1
                avgResolveMinutes: 18
                countsByCategory: { planning: 0, loading: 1, on_the_road: 1, store: 1 }
                countsBySeverity: { critical: 1, warning: 1, info: 1 }
              exceptions:
                - id: "shortfall:clx0sf1a2b3c4d5e6f7g8h9"
                  kind: SHORTFALL
                  severity: critical
                  category: loading
                  status: open
                  title: "Short 4 units · S1-082 on VEH017"
