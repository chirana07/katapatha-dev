                  departsAt: "04:11"
                  orderRefs: ["S1-082"]
                  affectedOutlets:
                    - { outletId: OUT027, outletName: "Kandy City Centre", stopSeq: 2, ordered: 20, delta: -4 }
                  quantities: { loaded: 16, expected: 20, short: 4 }
                  acknowledgement: null
                  resolution: null
                  decisionOptions:
                    - decision: SEND_SHORT
                      label: "Send short and notify the store"
                      description: "VEH017 leaves on time with 16 of 20 units. The store is told before departure."
                      recommended: true
